agent:
  # dummy identifiers, the agent runs in offline mode and never contacts the Kedify platform
  agentId: 00000000-0000-4000-8000-000000000001
  orgId: 00000000-0000-4000-8000-000000000001
  apiKey: kfy_00000000000000000000000000000000
  extraArgs:
    offline: true
  features:
    scaleAdaptersEnabled: true
  # the ScaleAdapter controller talks to the target only through its /scale
  # subresource, this is the sole extra permission it needs for Agones Fleets
  extraRbacRules:
    - apiGroups:
        - agones.dev
      resources:
        - fleets/scale
      verbs:
        - get
        - update
keda:
  enabled: true
