---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: haproxy
  namespace: flux-system
spec:
  interval: 10m
  releaseName: haproxy
  targetNamespace: ingress-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  values:
    controller:
      replicaCount: 2
      image:
        tag: 3.2.3
      ingressClass: haproxy
      service:
        type: ClusterIP
      podLabels:
        scaling-metrics: haproxy
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 400Mi
  chart:
    spec:
      chart: kubernetes-ingress
      version: 1.47.3
      sourceRef:
        kind: HelmRepository
        name: haproxy
        namespace: flux-system
      interval: 1h
