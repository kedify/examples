---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haproxy-metric-discovery
  namespace: ingress-system
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haproxy-metric-discovery
  namespace: ingress-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haproxy-metric-discovery
subjects:
- kind: ServiceAccount
  name: splunk-otel-splunk-otel-collector
  namespace: observability
