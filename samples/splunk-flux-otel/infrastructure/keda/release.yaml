---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: flux-system
spec:
  interval: 10m
  releaseName: keda
  targetNamespace: keda
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  values:
    env:
    - name: RAW_METRICS_GRPC_PROTOCOL
      value: enabled
    - name: RAW_METRICS_MODE
      value: pollinginterval
  chart:
    spec:
      chart: keda
      version: v2.20.0-1
      sourceRef:
        kind: HelmRepository
        name: kedify
        namespace: flux-system
      interval: 1h
