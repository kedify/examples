apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: __NAMESPACE__
  annotations:
    demo.kedify.io/cpu-control: file-v1
    demo.kedify.io/cpu-load: "false"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
          args:
            - |
              rm -f /tmp/kedify-demo-cpu-load
              touch /tmp/kedify-demo-cpu-control
              while true; do
                while [ -f /tmp/kedify-demo-cpu-load ]; do :; done
                sleep 1
              done
          resources:
            requests:
              cpu: 100m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 32Mi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
  namespace: __NAMESPACE__
  annotations:
    autoscaling.kedify.io/sync-period-seconds: "5"
spec:
  scaleTargetRef:
    name: worker
  pollingInterval: 5
  minReplicaCount: 1
  maxReplicaCount: 3
  advanced:
    horizontalPodAutoscalerConfig:
      name: worker-autoscaler
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
        scaleDown:
          stabilizationWindowSeconds: 0
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "50"
