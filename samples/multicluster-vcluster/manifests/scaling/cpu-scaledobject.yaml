apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
          args:
            - if [ "${CPU_LOAD}" = "true" ]; then while true; do :; done; else while true; do sleep 3600; done; fi
          env:
            - name: CPU_LOAD
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 32Mi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
  namespace: __NAMESPACE__
  annotations:
    autoscaling.kedify.io/sync-period-seconds: "5"
spec:
  scaleTargetRef:
    name: worker
  pollingInterval: 5
  minReplicaCount: 1
  maxReplicaCount: 3
  advanced:
    horizontalPodAutoscalerConfig:
      name: worker-autoscaler
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
        scaleDown:
          stabilizationWindowSeconds: 0
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "50"
