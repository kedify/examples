apiVersion: apps/v1
kind: Deployment
metadata:
  name: kedify-sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kedify-sample-app
  template:
    metadata:
      labels:
        app: kedify-sample-app
    spec:
      containers:
      - name: nginx-container
        image: nginx:1.30.7
        ports:
        - containerPort: 80

