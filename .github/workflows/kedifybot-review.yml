name: Kedifybot review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, review_requested]

permissions:
  pull-requests: read

concurrency:
  group: kedifybot-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    if: vars.KEDIFY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # This job reads GitHub metadata. It never checks out a repository.
      - name: Authorize review
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TEAM_IDS: ${{ secrets.KEDIFY_REVIEW_TEAM_IDS }}
          PILOT_PR: ${{ vars.KEDIFY_REVIEW_PILOT_PR }}
        run: |
          set -euo pipefail
          bot=153312683
          repo=$GITHUB_REPOSITORY
          [[ $repo =~ ^kedify/[A-Za-z0-9_.-]+$ ]] || exit 0

          action=$(jq -er '.action' "$GITHUB_EVENT_PATH")
          pr=$(jq -er '.number' "$GITHUB_EVENT_PATH")
          head=$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          [[ $pr =~ ^[1-9][0-9]*$ && $head =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ $PILOT_PR == all || $pr == "$PILOT_PR" ]] || exit 0
          case "$action" in
            opened|reopened|ready_for_review|synchronize|review_requested) ;;
            *) exit 0 ;;
          esac
          if [[ -z $TEAM_IDS && $GITHUB_ACTOR == 'dependabot[bot]' ]]; then
            echo 'Kedify review credentials are unavailable for this Dependabot event.'
            exit 0
          fi
          jq -e 'type == "array" and length > 0 and all(.[]; type == "number" and . > 0 and floor == .)' \
            <<< "$TEAM_IDS" >/dev/null

          current=$(gh api "repos/$repo/pulls/$pr")
          jq -e --arg repo "$repo" --arg head "$head" '
            .base.repo.full_name == $repo and .base.repo.visibility == "public" and
            .state == "open" and .draft == false and .head.sha == $head
          ' <<< "$current" >/dev/null || exit 0

          author=$(jq -er '.user.id' <<< "$current")
          [[ "$author" != "$bot" ]] || exit 0
          if jq -e --argjson id "$author" 'index($id) != null' <<< "$TEAM_IDS" >/dev/null; then
            [[ $action != review_requested ]] || exit 0
          elif [[ $action == review_requested ]]; then
            jq -e --argjson team "$TEAM_IDS" --argjson bot "$bot" '
              .sender.id as $sender | .requested_reviewer.id == $bot and ($team | index($sender) != null)
            ' "$GITHUB_EVENT_PATH" >/dev/null || exit 0
          else
            events=$(gh api --paginate --slurp "repos/$repo/issues/$pr/timeline?per_page=100")
            jq -e --argjson team "$TEAM_IDS" --argjson bot "$bot" '
              [.[][] | select(.requested_reviewer.id == $bot) | .review_requester.id as $requester |
                select(.event == "review_request_removed" or
                  (.event == "review_requested" and ($team | index($requester) != null)))] |
              last.event == "review_requested"
            ' <<< "$events" >/dev/null || exit 0
          fi

          reviews=$(gh api --paginate --slurp "repos/$repo/pulls/$pr/reviews?per_page=100")
          jq -e --argjson bot "$bot" --arg head "$head" '
            all(.[][]; .user.id != $bot or .commit_id != $head or .state != "COMMENTED" or
              ((.body // "") | rtrimstr("\n") | endswith("<!-- kedifybot:public-review:" + $head + " -->") | not))
          ' <<< "$reviews" >/dev/null || exit 0
          printf 'action=%s\npr=%s\nhead=%s\n' "$action" "$pr" "$head" >> "$GITHUB_OUTPUT"

      - name: Start Claude review
        if: steps.gate.outputs.head != ''
        env:
          ROUTINE_ID: ${{ vars.KEDIFY_REVIEW_ROUTINE_ID }}
          ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          ACTION: ${{ steps.gate.outputs.action }}
          PR: ${{ steps.gate.outputs.pr }}
          HEAD_SHA: ${{ steps.gate.outputs.head }}
        run: |
          set -euo pipefail
          if [[ ! $ROUTINE_ID =~ ^trig_[A-Za-z0-9]+$ || -z $ROUTINE_TOKEN ]]; then
            echo 'The Claude routine ID or token is missing from this run.' >&2
            exit 1
          fi
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg action "$ACTION" --argjson pr "$PR" --arg head "$HEAD_SHA" \
            '{text: ({version: 1, $repo, $action, $pr, $head} | tojson)}' |
            curl --fail --silent --show-error --max-time 30 --output /dev/null \
              --header @<(printf 'Authorization: Bearer %s\n' "$ROUTINE_TOKEN") \
              --header 'anthropic-version: 2023-06-01' \
              --header 'anthropic-beta: experimental-cc-routine-2026-04-01' \
              --header 'content-type: application/json' --data-binary @- \
              "https://api.anthropic.com/v1/claude_code/routines/$ROUTINE_ID/fire"
