# Generated by kedify/github-meta tools/ai-review/generate.cjs.
# Router SHA-256: b6130bab99318765956be37cd329a686c75cf5b1bdad906dd980be29ae1e6ea8
name: Kedifybot reusable reviewer

on:
  workflow_call:
    inputs:
      routine-url:
        type: string
        required: true
      sonnet-url:
        type: string
        default: ""
      pilot-pr:
        type: string
        default: "0"
    secrets:
      routine-token:
        required: false
      sonnet-token:
        required: false

jobs:
  route:
    if: ${{ inputs.routine-url != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: kedifybot-${{ github.repository_id }}
      queue: max
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Route the GitHub event
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          KEDIFY_REVIEW_ROUTINE_URL: ${{ inputs.routine-url }}
          KEDIFY_REVIEW_ROUTINE_TOKEN: ${{ secrets.routine-token }}
          KEDIFY_REVIEW_SONNET_ROUTINE_URL: ${{ inputs.sonnet-url }}
          KEDIFY_REVIEW_SONNET_ROUTINE_TOKEN: ${{ secrets.sonnet-token }}
          KEDIFY_REVIEW_PILOT_PR: ${{ inputs.pilot-pr }}
        with:
          script: |
            'use strict'

            const BOT = 153312683
            const ACTIONS_BOT = 41898282
            const RELAY = '.github/workflows/kedifybot-inline.yml'
            const MARKER = 'kedifybot-state:v1'
            const EMPTY = { enabled: false, transition: 0, receipts: [] }

            function parseState(comments) {
              const status = comments
                .filter(comment => comment.user?.id === ACTIONS_BOT && comment.body?.includes('<!-- ' + MARKER + ' '))
                .at(-1)
              if (!status) return { ...EMPTY, id: null }
              const match = status.body.match(/^<!-- kedifybot-state:v1 (.+) -->$/m)
              if (!match) throw new Error('Malformed reviewer state comment')
              const state = JSON.parse(match[1])
              if (typeof state.enabled !== 'boolean' || !Number.isSafeInteger(state.transition) || !Array.isArray(state.receipts)) {
                throw new Error('Malformed reviewer state')
              }
              return { ...state, id: status.id }
            }

            function statusBody(state) {
              return 'Automatic Kedify reviews are **' + (state.enabled ? 'on' : 'off') + '**. ' +
                'Request kedifybot in Reviewers to enable them. Use ' + String.fromCharCode(96) +
                '@kedifybot stop' + String.fromCharCode(96) + ' to stop push-triggered reviews.\n\n' +
                '<!-- ' + MARKER + ' ' + JSON.stringify({ enabled: state.enabled, transition: state.transition, receipts: state.receipts }) + ' -->'
            }

            function command(body) {
              if (/^@kedifybot[ \t]+stop$/i.test(body.trim())) return 'stop'
              if (/^@kedifybot[ \t]+\S/i.test(body.trim())) return 'question'
              return null
            }

            function requestedModel(body) {
              return body.trim().match(/^@kedifybot[ \t]+--model[ \t]+(\S+)/i)?.[1].toLowerCase() || 'opus'
            }

            function remember(receipts, key) {
              const prefix = key.split(':')[0] + ':'
              const relevant = receipts.filter(receipt => receipt.startsWith(prefix))
              const unrelated = receipts.filter(receipt => !receipt.startsWith(prefix))
              return [...unrelated, ...relevant.slice(prefix === 'head:' ? -23 : -95), key]
            }

            async function findRecord(method, params) {
              try {
                return (await method(params)).data
              } catch (error) {
                if (error.status === 404) return null
                throw error
              }
            }

            function expectedFireUrl(text, variable) {
              if (!/^https:\/\/api\.anthropic\.com\/v1\/claude_code\/routines\/[A-Za-z0-9_-]+\/fire$/.test(text)) {
                throw new Error('Set ' + variable + ' to the Claude Routine fire URL')
              }
              return text
            }

            function prFromUrl(url, repo) {
              if (typeof url !== 'string') return null
              const prefix = 'https://api.github.com/repos/' + repo.toLowerCase() + '/pulls/'
              if (!url.toLowerCase().startsWith(prefix)) return null
              const number = url.slice(prefix.length)
              return /^[1-9][0-9]{0,9}$/.test(number) ? Number(number) : null
            }

            async function route({ github, context, env, request = fetch }) {
              const event = context.payload
              const repo = context.repo
              const fullName = repo.owner + '/' + repo.repo
              const order = Number(env.GITHUB_RUN_NUMBER)
              if (!Number.isSafeInteger(order) || order < 1) throw new Error('Invalid caller run number')
              const pilotPr = Number(env.KEDIFY_REVIEW_PILOT_PR || '0')
              if (!Number.isSafeInteger(pilotPr) || pilotPr < 0) throw new Error('Invalid pilot PR number')
              if (repo.owner !== 'kedify' || event.repository?.full_name !== fullName) return
              const origin = event.sender
              if (context.eventName !== 'workflow_run' && (origin?.type !== 'User' || origin.id === BOT)) return

              async function permitted(user) {
                if (!user || user.type !== 'User' || user.id === BOT || !/^[A-Za-z0-9-]{1,39}$/.test(user.login)) return false
                try {
                  const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...repo, username: user.login })
                  return data.user?.id === user.id && ['admin', 'write'].includes(data.permission)
                } catch (error) {
                  if (error.status === 404) return false
                  throw error
                }
              }

              async function getPull(number) {
                if (!Number.isSafeInteger(number) || number < 1 || (pilotPr && number !== pilotPr)) return null
                const { data } = await github.rest.pulls.get({ ...repo, pull_number: number })
                return data.base.repo.full_name === fullName ? data : null
              }

              async function getState(pr) {
                const comments = await github.paginate(github.rest.issues.listComments, { ...repo, issue_number: pr.number })
                return parseState(comments)
              }

              async function save(pr, state) {
                const body = statusBody(state)
                if (state.id) await github.rest.issues.updateComment({ ...repo, comment_id: state.id, body })
                else {
                  const { data } = await github.rest.issues.createComment({ ...repo, issue_number: pr.number, body })
                  if (data.user?.id !== ACTIONS_BOT) throw new Error('Unexpected status comment author')
                  state.id = data.id
                }
              }

              async function stop(pr, state, commentId) {
                const key = 'stop:' + commentId
                if (state.receipts.includes(key)) return
                // A later relay can rediscover this comment even when this run is stale.
                state.receipts = remember(state.receipts, key)
                if (order > state.transition) {
                  state.enabled = false
                  state.transition = order
                }
                await save(pr, state)
              }

              async function fire(pr, state, kind, commentId, model = 'opus') {
                const auto = kind === 'review'
                if (!/^[a-f0-9]{40}$/.test(pr.head.sha)) throw new Error('Invalid PR head SHA')
                const key = auto ? 'head:' + pr.head.sha : 'comment:' + commentId
                if (state.receipts.includes(key)) return
                if (!['opus', 'sonnet'].includes(model)) throw new Error('Choose opus or sonnet for --model')
                const prefix = model === 'sonnet' ? 'KEDIFY_REVIEW_SONNET_ROUTINE' : 'KEDIFY_REVIEW_ROUTINE'
                const url = expectedFireUrl(env[prefix + '_URL'] || '', prefix + '_URL')
                const token = env[prefix + '_TOKEN']
                if (!token) throw new Error('Set ' + prefix + '_TOKEN in GitHub Actions secrets')

                // Persist the claim before an asynchronous call. A network failure can
                // occur after acceptance, so an ambiguous claim must not auto-retry.
                const previous = state.receipts
                state.receipts = remember(previous, key)
                await save(pr, state)
                const response = await request(url, {
                  method: 'POST',
                  redirect: 'error',
                  signal: AbortSignal.timeout(20000),
                  headers: {
                    Authorization: 'Bearer ' + token,
                    'Content-Type': 'application/json',
                    'anthropic-version': '2023-06-01',
                    'anthropic-beta': 'experimental-cc-routine-2026-04-01'
                  },
                  body: JSON.stringify({ text: JSON.stringify({
                    version: 1, kind, repo: fullName, pr: pr.number, head: pr.head.sha,
                    comment_id: commentId ?? null, status_comment_id: state.id
                  }) })
                })
                if (response.ok) return
                if ([400, 401, 403, 404, 422, 429].includes(response.status)) {
                  state.receipts = previous
                  await save(pr, state)
                }
                throw new Error('Claude Routine rejected the request with HTTP ' + response.status)
              }

              if (context.eventName === 'pull_request_target') {
                const { action, pull_request: incoming } = event
                if (!['review_requested', 'synchronize', 'ready_for_review', 'closed'].includes(action)) return
                if (action === 'review_requested' && (event.requested_reviewer?.id !== BOT || !await permitted(origin))) return
                const pr = await getPull(incoming?.number)
                if (!pr) return
                if (action === 'synchronize' && incoming.head.sha !== pr.head.sha) return
                const state = await getState(pr)
                if (action === 'closed') {
                  if (pr.state === 'closed' && state.enabled && order > state.transition) {
                    state.enabled = false
                    state.transition = order
                    await save(pr, state)
                  }
                  return
                }
                if (pr.state !== 'open') return
                if (action === 'review_requested') {
                  // A replay after the pending review is cleared must not undo stop.
                  if (order < state.transition || !pr.requested_reviewers.some(reviewer => reviewer.id === BOT)) return
                  if (order > state.transition) {
                    state.enabled = true
                    state.transition = order
                    await save(pr, state)
                  }
                }
                if (state.enabled && !pr.draft) await fire(pr, state, 'review')
                return
              }

              if (context.eventName === 'issue_comment' && event.action === 'created' && event.issue?.pull_request) {
                const pr = await getPull(event.issue.number)
                if (!pr || pr.state !== 'open' || !Number.isSafeInteger(event.comment?.id)) return
                const comment = await findRecord(github.rest.issues.getComment, { ...repo, comment_id: event.comment.id })
                if (comment?.user?.id !== origin.id || comment.issue_url !== 'https://api.github.com/repos/' +
                    fullName + '/issues/' + pr.number) return
                const mode = command(comment.body || '')
                if (!mode || !await permitted(comment.user)) return
                const state = await getState(pr)
                if (mode === 'stop') await stop(pr, state, comment.id)
                else await fire(pr, state, 'conversation', comment.id, requestedModel(comment.body || ''))
                return
              }

              if (context.eventName === 'workflow_run' && event.action === 'completed') {
                const run = event.workflow_run
                if (!run || run.event !== 'pull_request_review_comment' || run.conclusion !== 'success' ||
                    run.repository?.id !== event.repository.id || run.path?.split('@')[0] !== RELAY ||
                    !await permitted(run.actor)) return
                const start = Date.parse(run.created_at)
                if (!Number.isFinite(start)) return
                const since = new Date(start - 5 * 60_000).toISOString()
                // Triggered by the completed inline event, not by a schedule. GitHub's
                // workflow_run payload can omit pull_requests for a fork. Correlate
                // canonical comments by author and event time instead of trusting data
                // produced by the fork workflow.
                const errors = []
                pages: for await (const page of github.paginate.iterator(github.rest.pulls.listReviewCommentsForRepo, {
                  ...repo, since, sort: 'created', direction: 'asc', per_page: 100
                })) {
                  for (const comment of page.data) {
                    const created = Date.parse(comment.created_at)
                    if (created > start + 60_000) break pages
                    if (!Number.isFinite(created) || created <= start - 5 * 60_000 ||
                        comment.user?.id !== run.actor.id) continue
                    try {
                      const number = prFromUrl(comment.pull_request_url, fullName)
                      const pr = await getPull(number)
                      if (!pr || pr.state !== 'open' || !Number.isSafeInteger(comment.id)) continue
                      if (run.head_repository?.id && run.head_repository.id !== event.repository.id &&
                          run.head_repository.id !== pr.head.repo?.id) continue
                      const mode = command(comment.body || '')
                      if (!mode) {
                        if (!Number.isSafeInteger(comment.in_reply_to_id)) continue
                        const root = await findRecord(github.rest.pulls.getReviewComment, {
                          ...repo, comment_id: comment.in_reply_to_id
                        })
                        if (root?.user?.id !== BOT || prFromUrl(root.pull_request_url, fullName) !== pr.number) continue
                      }
                      const state = await getState(pr)
                      if (mode === 'stop') await stop(pr, state, comment.id)
                      else await fire(pr, state, 'inline', comment.id, requestedModel(comment.body || ''))
                    } catch (error) {
                      errors.push(error)
                    }
                  }
                }
                if (errors.length) throw new AggregateError(errors, 'Could not process one or more inline requests')
              }
            }


            await route({ github, context, env: process.env })
